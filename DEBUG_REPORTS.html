<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Debug Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #e6edf3; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        .section { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        .section h2 { color: #79c0ff; font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .test-button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin: 5px; }
        .test-button:hover { background: #2ea043; }
        .output { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 15px; margin-top: 15px; font-size: 12px; max-height: 400px; overflow-y: auto; }
        .output.success { border-color: #3fb950; }
        .output.error { border-color: #f85149; color: #f85149; }
        .status { padding: 10px; border-radius: 4px; margin: 10px 0; }
        .status.ok { background: rgba(63, 185, 80, 0.1); border: 1px solid #3fb950; color: #3fb950; }
        .status.error { background: rgba(248, 81, 73, 0.1); border: 1px solid #f85149; color: #f85149; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐛 Reports Debug Dashboard</h1>
        
        <div class="section">
            <h2>1️⃣ Session & Debug Info</h2>
            <button class="test-button" onclick="testDebugAPI()">Test Debug API</button>
            <div id="debug-output" class="output"></div>
        </div>
        
        <div class="section">
            <h2>2️⃣ Direct Reports API Test</h2>
            <button class="test-button" onclick="testReportsAPI()">Test Reports API (List)</button>
            <button class="test-button" onclick="testReportsAPIStats()">Test Reports API (Stats)</button>
            <div id="reports-output" class="output"></div>
        </div>
        
        <div class="section">
            <h2>3️⃣ Frontend API Test</h2>
            <button class="test-button" onclick="testFrontendAPI()">Test Frontend API.getReports()</button>
            <div id="frontend-output" class="output"></div>
        </div>
        
        <div class="section">
            <h2>4️⃣ Session Check</h2>
            <button class="test-button" onclick="checkSessionStorage()">Check Session Storage</button>
            <button class="test-button" onclick="checkLocalStorage()">Check Local Storage</button>
            <div id="storage-output" class="output"></div>
        </div>
    </div>

    <script src="/School_Facility_Maintenance_System/frontend/assets/js/api.js"></script>
    <script>
        const baseURL = '/School_Facility_Maintenance_System/backend/api';
        
        function log(message, data = null) {
            console.log(message, data);
        }
        
        async function testDebugAPI() {
            const output = document.getElementById('debug-output');
            try {
                output.innerHTML = '<pre>Loading...</pre>';
                const response = await fetch(`${baseURL}/debug-reports.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                output.innerHTML = '<pre class="success">' + JSON.stringify(data, null, 2) + '</pre>';
                output.classList.add('success');
                output.classList.remove('error');
            } catch (error) {
                output.innerHTML = '<pre class="error">ERROR: ' + error.message + '</pre>';
                output.classList.add('error');
                output.classList.remove('success');
            }
        }
        
        async function testReportsAPI() {
            const output = document.getElementById('reports-output');
            try {
                output.innerHTML = '<pre>Loading...</pre>';
                const response = await fetch(`${baseURL}/reports.php?action=list`, {
                    credentials: 'include'
                });
                const data = await response.json();
                output.innerHTML = '<pre class="success">' + JSON.stringify(data, null, 2) + '</pre>';
                output.classList.add('success');
                output.classList.remove('error');
                
                // Show status
                if (data.success) {
                    const count = data.data?.reports?.length || 0;
                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'status ok';
                    statusDiv.innerHTML = `✅ API Working! Found ${count} reports`;
                    output.parentElement.insertBefore(statusDiv, output);
                } else {
                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'status error';
                    statusDiv.innerHTML = `❌ API Error: ${data.message}`;
                    output.parentElement.insertBefore(statusDiv, output);
                }
            } catch (error) {
                output.innerHTML = '<pre class="error">ERROR: ' + error.message + '</pre>';
                output.classList.add('error');
                output.classList.remove('success');
            }
        }
        
        async function testReportsAPIStats() {
            const output = document.getElementById('reports-output');
            try {
                output.innerHTML = '<pre>Loading...</pre>';
                const response = await fetch(`${baseURL}/reports.php?action=stats`, {
                    credentials: 'include'
                });
                const data = await response.json();
                output.innerHTML = '<pre class="success">' + JSON.stringify(data, null, 2) + '</pre>';
                output.classList.add('success');
                output.classList.remove('error');
            } catch (error) {
                output.innerHTML = '<pre class="error">ERROR: ' + error.message + '</pre>';
                output.classList.add('error');
                output.classList.remove('success');
            }
        }
        
        async function testFrontendAPI() {
            const output = document.getElementById('frontend-output');
            try {
                output.innerHTML = '<pre>Loading...</pre>';
                
                if (typeof API === 'undefined') {
                    output.innerHTML = '<pre class="error">ERROR: API object not defined. Make sure api.js is loaded.</pre>';
                    output.classList.add('error');
                    return;
                }
                
                const response = await API.getReports();
                output.innerHTML = '<pre class="success">' + JSON.stringify(response, null, 2) + '</pre>';
                output.classList.add('success');
                output.classList.remove('error');
                
                if (response.success) {
                    const count = response.data?.reports?.length || 0;
                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'status ok';
                    statusDiv.innerHTML = `✅ Frontend API Working! Found ${count} reports`;
                    output.parentElement.insertBefore(statusDiv, output);
                }
            } catch (error) {
                output.innerHTML = '<pre class="error">ERROR: ' + error.message + '</pre>';
                output.classList.add('error');
                output.classList.remove('success');
            }
        }
        
        function checkSessionStorage() {
            const output = document.getElementById('storage-output');
            const data = {
                sessionStorage: sessionStorage.length > 0 ? Object.fromEntries(Object.entries(sessionStorage)) : 'Empty',
                keys: Object.keys(sessionStorage)
            };
            output.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
        
        function checkLocalStorage() {
            const output = document.getElementById('storage-output');
            const data = {
                localStorage: localStorage.length > 0 ? Object.fromEntries(Object.entries(localStorage)) : 'Empty',
                keys: Object.keys(localStorage),
                user: localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')) : null
            };
            output.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            console.log('Debug page loaded');
            console.log('API object available:', typeof API !== 'undefined');
        });
    </script>
</body>
</html>
