<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Use Case Diagram - School Facility Maintenance System</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --line: #2f3c4f;
      --text: #1f2a38;
      --accent: #0b8f7a;
      --actor: #1f2a38;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top left, #e3ecff 0%, var(--bg) 45%, #eef3ff 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .wrapper {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid #d6deed;
      border-radius: 16px;
      box-shadow: 0 14px 28px rgba(20, 37, 63, 0.1);
      overflow: hidden;
    }

    .header {
      padding: 18px 24px;
      border-bottom: 1px solid #d6deed;
      background: linear-gradient(90deg, #dff8f3, #ecf3ff);
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f3a4f;
    }

    .header p {
      margin-top: 6px;
      font-size: 14px;
      color: #33495f;
    }

    .canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #fcfdff;
    }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      padding: 14px 24px 22px;
      border-top: 1px dashed #c9d3e8;
      font-size: 13px;
      color: #41566c;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #52647c;
      background: #fff;
      display: inline-block;
    }

    .dot.actor {
      background: #1f2a38;
      border-color: #1f2a38;
    }

    .dot.system {
      background: #dff8f3;
      border-color: #0b8f7a;
    }

    @media (max-width: 980px) {
      body {
        padding: 10px;
      }

      .header h1 {
        font-size: 18px;
      }

      .header p {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>Use Case Diagram</h1>
      <p>School Facility Maintenance System</p>
    </div>

    <svg class="canvas" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Use case diagram">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#2f3c4f" />
        </marker>
      </defs>

      <rect x="250" y="80" width="900" height="820" rx="14" ry="14" fill="#f8fffd" stroke="#0b8f7a" stroke-width="2.2" />
      <text x="280" y="115" font-size="20" font-weight="700" fill="#0f4d43">School Facility Maintenance System</text>

      <g fill="none" stroke="#1f2a38" stroke-width="3">
        <circle cx="85" cy="215" r="28" />
        <line x1="85" y1="243" x2="85" y2="320" />
        <line x1="40" y1="270" x2="130" y2="270" />
        <line x1="85" y1="320" x2="52" y2="372" />
        <line x1="85" y1="320" x2="118" y2="372" />
      </g>
      <text x="26" y="402" font-size="16" fill="#1f2a38" font-weight="600">EELAB Staff</text>

      <g fill="none" stroke="#1f2a38" stroke-width="3">
        <circle cx="85" cy="540" r="28" />
        <line x1="85" y1="568" x2="85" y2="645" />
        <line x1="40" y1="595" x2="130" y2="595" />
        <line x1="85" y1="645" x2="52" y2="697" />
        <line x1="85" y1="645" x2="118" y2="697" />
      </g>
      <text x="23" y="728" font-size="16" fill="#1f2a38" font-weight="600">Maintenance Admin</text>

      <g fill="none" stroke="#1f2a38" stroke-width="3">
        <circle cx="1310" cy="370" r="28" />
        <line x1="1310" y1="398" x2="1310" y2="475" />
        <line x1="1265" y1="425" x2="1355" y2="425" />
        <line x1="1310" y1="475" x2="1277" y2="527" />
        <line x1="1310" y1="475" x2="1343" y2="527" />
      </g>
      <text x="1272" y="558" font-size="16" fill="#1f2a38" font-weight="600">Super Admin</text>

      <g font-size="14" fill="#1f2a38" stroke="#2f3c4f" stroke-width="1.8" text-anchor="middle">
        <ellipse cx="430" cy="205" rx="115" ry="36" fill="#ffffff" />
        <text x="430" y="210">Register / Login</text>

        <ellipse cx="430" cy="305" rx="130" ry="36" fill="#ffffff" />
        <text x="430" y="310">Submit Maintenance Report</text>

        <ellipse cx="430" cy="410" rx="110" ry="36" fill="#ffffff" />
        <text x="430" y="415">Track Report Status</text>

        <ellipse cx="700" cy="250" rx="130" ry="36" fill="#ffffff" />
        <text x="700" y="255">Assign Technician</text>

        <ellipse cx="700" cy="360" rx="120" ry="36" fill="#ffffff" />
        <text x="700" y="365">Update Report Status</text>

        <ellipse cx="700" cy="470" rx="145" ry="36" fill="#ffffff" />
        <text x="700" y="475">Generate Monthly Reports</text>

        <ellipse cx="970" cy="230" rx="120" ry="36" fill="#ffffff" />
        <text x="970" y="235">Manage Users</text>

        <ellipse cx="970" cy="340" rx="130" ry="36" fill="#ffffff" />
        <text x="970" y="345">View All Reports</text>

        <ellipse cx="970" cy="450" rx="150" ry="36" fill="#ffffff" />
        <text x="970" y="455">Filter Reports by Date/Status</text>

        <ellipse cx="700" cy="610" rx="155" ry="36" fill="#ffffff" />
        <text x="700" y="615">Send Status Notifications</text>
      </g>

      <g stroke="#2f3c4f" stroke-width="2" fill="none">
        <line x1="130" y1="258" x2="314" y2="205" />
        <line x1="130" y1="270" x2="298" y2="305" />
        <line x1="130" y1="282" x2="320" y2="410" />

        <line x1="130" y1="583" x2="570" y2="250" />
        <line x1="130" y1="595" x2="580" y2="360" />
        <line x1="130" y1="607" x2="555" y2="470" />
        <line x1="130" y1="619" x2="545" y2="610" />

        <line x1="1278" y1="412" x2="1090" y2="230" />
        <line x1="1278" y1="425" x2="1100" y2="340" />
        <line x1="1278" y1="438" x2="1120" y2="450" />
        <line x1="1278" y1="452" x2="845" y2="470" />
      </g>

      <g stroke="#2f3c4f" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)">
        <line x1="700" y1="506" x2="700" y2="574" />
        <line x1="820" y1="450" x2="845" y2="470" />
      </g>

      <g font-size="13" fill="#2f3c4f" font-style="italic">
        <text x="712" y="548">&lt;&lt;include&gt;&gt;</text>
        <text x="800" y="440">&lt;&lt;extend&gt;&gt;</text>
      </g>
    </svg>

    <div class="legend">
      <span class="chip"><span class="dot actor"></span>Actor</span>
      <span class="chip"><span class="dot"></span>Use Case</span>
      <span class="chip"><span class="dot system"></span>System Boundary</span>
      <span class="chip">Dashed concepts shown with include/extend labels</span>
    </div>
  </div>
</body>
</html>
